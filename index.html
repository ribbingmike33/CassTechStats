<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cass Tech Football — Technicians Stats</title>
<style>
:root{
  --navy:#006B4F; --navy2:#004F3A; --gold:#FFFFFF; --ink:#17352A;
  --muted:#477264; --bg:#F7FBF9; --card:#FFFFFF; --line:#BFD8CE;
  --good:#087443; --danger:#b42318;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
button,input,select{font:inherit}
button{cursor:pointer}
.topbar{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:18px max(18px,calc((100vw - 1180px)/2));position:sticky;top:0;z-index:20;box-shadow:0 2px 12px #001a2b2b}
.brand{display:flex;align-items:center;gap:13px}
.mark{width:42px;height:42px;border:2px solid var(--gold);border-radius:8px;display:grid;place-items:center;font-weight:900;color:#fff;letter-spacing:-1px}
.brand h1{font-size:18px;margin:0}.brand p{font-size:11px;margin:2px 0 0;opacity:.78;text-transform:uppercase;letter-spacing:1.4px}
nav{max-width:1180px;margin:0 auto;padding:12px 18px;display:flex;gap:8px;overflow:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.navbtn{white-space:nowrap;border:0;background:transparent;color:#526476;padding:10px 14px;border-radius:9px;font-weight:750}
.navbtn.active{background:var(--navy);color:#fff}
main{max-width:1180px;margin:0 auto;padding:20px 18px 60px}
.page{display:none}.page.active{display:block}
h2{margin:4px 0 4px;font-size:28px}.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 8px #1022350a}
.pad{padding:18px}
.grid{display:grid;gap:16px}.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
label{font-size:12px;font-weight:800;color:#526476;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:6px}
select,input{width:100%;border:1px solid #cbd6e0;border-radius:9px;background:#fff;padding:11px 12px;color:var(--ink);outline:none}
select:focus,input:focus{border-color:var(--navy)}
.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:800}
.primary{background:var(--navy);color:#fff}.gold{background:#FFFFFF;color:var(--navy);border:1px solid #d7e1dc}.ghost{background:#EAF4F0;color:var(--navy);border:1px solid #BFD8CE}
.danger{background:#E8F3EE;color:#8A241A;border:1px solid #BFD8CE}
.tabs{display:flex;gap:7px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{border:0;background:none;padding:11px 14px;color:var(--muted);font-weight:800;border-bottom:3px solid transparent}
.tab.active{color:var(--navy);border-color:#fff}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:#F1F8F5;border:1px solid var(--line);border-radius:10px;padding:14px}.stat b{font-size:24px;display:block}.stat span{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:800}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);font-size:13px}th{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.4px;background:#EAF4F0}tr:last-child td{border-bottom:0}
.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:900;text-transform:uppercase;background:#edf3f8;color:var(--navy)}
.hero{background:linear-gradient(135deg,#062a4d,#0b477c);color:#fff;border-radius:16px;padding:22px;margin-bottom:16px}
.hero .score{font-size:40px;font-weight:950;letter-spacing:-1px}.hero small{opacity:.7;text-transform:uppercase;font-weight:800}
.play-layout{display:grid;grid-template-columns:340px 1fr;gap:16px}
.type-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:16px}
.type-btn{padding:12px 5px;border:1px solid var(--line);background:#fff;border-radius:9px;font-weight:850;color:#526476}
.type-btn.active{background:var(--navy);border-color:var(--navy);color:#fff}
.field-wrap{background:#006B4F;border-radius:14px;padding:16px;box-shadow:inset 0 0 0 2px #ffffff18}
.field{position:relative;height:min(560px,72vh);min-height:390px;border:2px solid #fff;border-radius:8px;overflow:hidden;background:repeating-linear-gradient(to bottom,#087A59 0,#087A59 9.09%,#006B4F 9.09%,#006B4F 18.18%)}
.field:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(9.09% - 1px),#ffffffb5 calc(9.09% - 1px),#ffffffb5 9.09%)}
.endzone{position:absolute;left:0;right:0;height:9.09%;background:#004F3A;border-bottom:1px solid #fff;border-top:1px solid #fff;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:950;letter-spacing:2px;z-index:2}
.ez-top{top:0}.ez-bottom{bottom:0}
.yl{position:absolute;left:7px;color:#fff;font-size:10px;font-weight:900;z-index:3;text-shadow:0 1px 2px #000}.y15{top:18%}.y20{top:27%}.y30{top:36%}.y40{top:45%}.y50{top:49%}.y60{top:54%}.y70{top:63%}.y80{top:72%}.y90{top:81%}
.ball{position:absolute;width:30px;height:30px;border-radius:50%;background:#9b5427;border:3px solid #fff;box-shadow:0 3px 8px #0008;z-index:10;transform:translate(-50%,-50%);touch-action:none;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:900}
.ball:after{content:"";width:8px;height:3px;background:#fff;border-radius:2px;transform:rotate(90deg)}
.endball{background:#b76b2f}
.field-info{display:flex;justify-content:space-between;color:#fff;font-weight:850;margin:0 3px 9px;font-size:13px}
.yards{font-size:34px;font-weight:950;text-align:center;color:#fff;margin-top:9px}.yards small{font-size:12px;display:block;opacity:.7;text-transform:uppercase}
.play-preview{margin-top:14px;background:#F1F8F5;border:1px solid var(--line);border-radius:10px;padding:13px;font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted)}.empty{padding:30px;text-align:center;color:var(--muted)}
.mobile-only{display:none}
@media(max-width:800px){
 main{padding:16px 12px 40px}.grid2,.grid3,.play-layout{grid-template-columns:1fr}.statgrid{grid-template-columns:repeat(2,1fr)}
 .play-layout{display:flex;flex-direction:column}.controls{order:1}.field-card{order:2}
 .type-grid{grid-template-columns:repeat(2,1fr)}.field{height:62vh;min-height:390px}
 h2{font-size:24px}.desktop-only{display:none}.mobile-only{display:block}
}

.player-chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;max-height:310px;overflow:auto;padding:2px}
.player-chip,.def-btn{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:8px;padding:8px 6px;text-align:left;font-weight:800}
.player-chip span{display:block;font-size:9px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.player-chip.selected,.def-btn.selected{background:var(--navy);color:#fff;border-color:var(--navy)}
.player-chip.selected span{color:#fff;opacity:.8}
.def-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
@media(max-width:800px){.player-chips{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><div class="mark">CT</div><div><h1>Cass Technical High School</h1><p>Technicians Football · Detroit</p></div></div>
</header>
<nav id="nav">
  <button class="navbtn active" data-page="schedule">Schedule</button>
  <button class="navbtn" data-page="season">Season Stats</button>
  <button class="navbtn" data-page="log">Log Stats</button>
</nav>

<main>
<section id="schedule" class="page active">
  <h2>Schedule</h2><p class="sub">2026 Cass Tech Football</p>
  <div class="hero"><small>Season Record</small><div class="score" id="record">0–0</div><div id="recordDetail">No games entered yet</div></div>
  <div class="card pad">
    <div class="row" style="margin-bottom:12px"><strong>Games</strong><button class="btn ghost" onclick="addGame()">Add Game</button></div>
    <div id="scheduleTable"></div>
  </div>
</section>

<section id="season" class="page">
  <h2>Season Stats</h2><p class="sub">All statistics calculated from logged plays.</p>
  <div class="tabs"><button class="tab active" data-stab="individual">Individual</button><button class="tab" data-stab="team">Team</button></div>
  <div id="individualStats" class="card pad"></div>
  <div id="teamStats" class="card pad" style="display:none"></div>
</section>

<section id="log" class="page">
  <h2>Log Stats</h2><p class="sub">Enter every play. Season totals update automatically.</p>
  <div class="card pad" style="margin-bottom:16px">
    <div class="grid grid3">
      <div><label>Game</label><select id="gameSelect"></select></div>
      <div><label>Quarter</label><select id="quarter"><option>1</option><option>2</option><option>3</option><option>4</option><option>OT</option></select></div>
      <div><label>Possession</label><select id="possession"><option value="cass">Cass Tech</option><option value="opponent">Opponent</option></select></div>
    </div>
  </div>
  <div class="play-layout">
    <div class="card pad controls">
      <label>Play Type</label>
      <div class="type-grid">
        <button class="type-btn active" data-type="run">Run</button>
        <button class="type-btn" data-type="pass">Pass</button>
        <button class="type-btn" data-type="special">Special Teams</button>
        <button class="type-btn" data-type="penalty">Penalty</button>
      </div>
      <div id="dynamicControls"></div>
      <button class="btn primary" style="width:100%;margin-top:14px" onclick="logPlay()">Log Play</button>
      <div id="preview" class="play-preview"></div>
    </div>
    <div class="card pad field-card">
      <div id="fieldUI"></div>
    </div>
  </div>
  <div class="card pad" style="margin-top:16px">
    <div class="row"><strong>Game Play Log</strong><span id="playCount" class="badge">0 plays</span></div>
    <div id="playLog" style="margin-top:10px"></div>
  </div>
</section>
</main>

<script>
const players=[
 {n:"#0",name:"Bryce Graham"},{n:"#1",name:"Mylan Griggs"},{n:"#2",name:"De'mari Hendrix"},
 {n:"#3",name:"Lamarcus Army"},{n:"#4",name:"Collin Sumpter"},{n:"#5",name:"Marquell Evans Jr."},
 {n:"#6",name:"Pierre Johnson"},{n:"#7",name:"Julian Taylor"},{n:"#8",name:"Donald Tabron II"},
 {n:"#9",name:"Anthony Foster"},{n:"#10",name:"Peyton Robinson"},{n:"#11",name:"Kaden Johnson"},
 {n:"#13",name:"William Welch"},{n:"#15",name:"Kaden Stringfellow"},{n:"#16",name:"Jamierre Johnson"},
 {n:"#17",name:"Jacob Stinson"},{n:"#17",name:"Landon Bryant"},{n:"#20",name:"Tailor Thomas"},
 {n:"#21",name:"Khamari Jones"},{n:"#22",name:"Tyler Barnett"},{n:"#23",name:"Isaih Leggett"},
 {n:"#25",name:"Justin McCallum"},{n:"#33",name:"Mark Brown"},{n:"#44",name:"Martez Livingston"},
 {n:"#45",name:"Braydin Kilgore"},{n:"#50",name:"Harold Medley"},{n:"#51",name:"Davis Green"},
 {n:"#54",name:"Trenton Lumpkins"},{n:"#55",name:"Antijuan Wilkes Jr."},{n:"#56",name:"Josh Baker"},
 {n:"#57",name:"Major Marion"},{n:"#93",name:"Antoine Hall"}
];
let games=JSON.parse(localStorage.getItem("ct_games")||"null")||[
 {id:"g1",date:"2026-08-28",opp:"Detroit King",loc:"Away",cass:0,oppScore:0},
 {id:"g2",date:"2026-09-04",opp:"Martin Luther King",loc:"Home",cass:0,oppScore:0},
 {id:"g3",date:"2026-09-11",opp:"Brother Rice",loc:"Away",cass:0,oppScore:0}
];
let plays=JSON.parse(localStorage.getItem("ct_plays")||"[]");
let type="run", startY=15, endY=15;
const save=()=>{localStorage.setItem("ct_games",JSON.stringify(games));localStorage.setItem("ct_plays",JSON.stringify(plays));};

function playerOptions(blank=true){return (blank?'<option value="">Select player</option>':'')+players.map(p=>`<option value="${p.n}|${p.name}">${p.n} ${p.name}</option>`).join("")}
function renderSchedule(){
 let wins=games.filter(g=>g.cass>g.oppScore).length,loss=games.filter(g=>g.cass<g.oppScore).length;
 document.getElementById("record").textContent=`${wins}–${loss}`;
 document.getElementById("recordDetail").textContent=games.length?`${games.length} games scheduled`:"No games entered yet";
 document.getElementById("scheduleTable").innerHTML=games.length?`<table><thead><tr><th>Date</th><th>Opponent</th><th>Location</th><th>Result</th></tr></thead><tbody>${games.map(g=>`<tr><td>${fmtDate(g.date)}</td><td><strong>${g.opp}</strong></td><td>${g.loc}</td><td>${g.cass||g.oppScore?`${g.cass}–${g.oppScore}`:"—"}</td></tr>`).join("")}</tbody></table>`:'<div class="empty">No games scheduled.</div>';
}
function addGame(){
 let opp=prompt("Opponent name"); if(!opp)return;
 let date=prompt("Game date (YYYY-MM-DD)","2026-09-18"); if(!date)return;
 games.push({id:"g"+Date.now(),date,opp,loc:"Home",cass:0,oppScore:0});save();renderAll();
}
function fmtDate(s){let [y,m,d]=s.split("-");return new Date(Number(y),Number(m)-1,Number(d)).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}
function renderGameSelect(){
 document.getElementById("gameSelect").innerHTML=games.map(g=>`<option value="${g.id}">${fmtDate(g.date)} — ${g.opp}</option>`).join("");
}
function renderField(){
 const field=document.getElementById("fieldUI");
 if(type==="penalty"){
   field.innerHTML='<div class="empty" style="height:100%;display:grid;place-items:center"><div><strong>Penalty selected</strong><br><span class="muted">Penalties do not require field placement.</span></div></div>';
   return;
 }
 field.innerHTML=`<div class="field-wrap"><div class="field-info"><span>CASS TECH</span><span>OPPONENT</span></div><div class="field" id="field">
 <div class="endzone ez-top">OPP END ZONE</div><div class="endzone ez-bottom">CASS TECH END ZONE</div>
 <span class="yl y15">15</span><span class="yl y20">20</span><span class="yl y30">30</span><span class="yl y40">40</span><span class="yl y50">50</span><span class="yl y60">40</span><span class="yl y70">30</span><span class="yl y80">20</span><span class="yl y90">10</span>
 <div class="ball" id="startBall"></div><div class="ball endball" id="endBall"></div></div>
 <div class="yards" id="yards"></div></div>`;
 positionBalls(); enableDrag(document.getElementById("startBall"),true);enableDrag(document.getElementById("endBall"),false);
}
function yardToPct(y){return 100-(y/100*100)}
function pctToY(p){return Math.max(0,Math.min(100,Math.round((100-p)*100/5)*5))}
function positionBalls(){
 let a=document.getElementById("startBall"),b=document.getElementById("endBall"); if(!a)return;
 a.style.left="50%";a.style.top=yardToPct(startY)+"%"; b.style.left="50%";b.style.top=yardToPct(endY)+"%";
 updateYards();
}
function enableDrag(el,isStart){
 const field=()=>document.getElementById("field");
 const move=e=>{
  e.preventDefault();let r=field().getBoundingClientRect();let y=(e.clientY-r.top)/r.height*100;
  let yard=pctToY(y); if(isStart)startY=yard;else endY=yard;positionBalls();
 };
 el.onpointerdown=e=>{el.setPointerCapture(e.pointerId);el.onpointermove=move;el.onpointerup=()=>{el.onpointermove=null};}
}
function updateYards(){
 let y=endY-startY;
 document.getElementById("yards").innerHTML=type==="pass"?(y>=0?`+${y}`:y)+` <small>yards to catch</small>`:((y>=0?"+":"")+y)+` <small>yards</small>`;
 updatePreview();
}
let rosterSelections={runner:null,passer:null,receiver:null,specialPlayer:null,penPlayer:null};

function rosterPicker(role,label,multi=false){
 return `<label>${label}</label><div class="player-chips role-picker" data-role="${role}" data-multi="${multi}">`+
 players.map((p,i)=>`<button type="button" class="player-chip ${multi?"":"single-chip"}" data-player="${i}" data-role="${role}"><strong>${p.n}</strong><span>${p.name}</span></button>`).join("")+
 `</div>`;
}
function wireRosterPickers(){
 document.querySelectorAll('.role-picker[data-role="penPlayer"] .player-chip[data-player="-1"]').forEach(b=>{b.classList.add("selected");rosterSelections.penPlayer=-1;});
 document.querySelectorAll(".role-picker .player-chip").forEach(b=>b.onclick=()=>{
   const role=b.dataset.role, multi=b.parentElement.dataset.multi==="true";
   if(!multi){
     b.parentElement.querySelectorAll(".player-chip").forEach(x=>x.classList.remove("selected"));
     rosterSelections[role]=Number(b.dataset.player);
   }
   b.classList.toggle("selected",multi?!b.classList.contains("selected"):true);
   if(multi) rosterSelections[role]=[...b.parentElement.querySelectorAll(".player-chip.selected")].map(x=>Number(x.dataset.player));
   updatePreview();
 });
}
function chosenPlayer(role){
 const v=rosterSelections[role];
 if(Array.isArray(v)) return v.map(i=>players[i]);
 if(v===-1) return {n:"TEAM",name:"Team"};
 return v===null||v===undefined?null:players[v];
}
function clearRosterSelections(){
 rosterSelections={runner:null,passer:null,receiver:null,specialPlayer:null,penPlayer:null};
}
function controls(){
 const dc=document.getElementById("dynamicControls");
 clearRosterSelections();
 const possession=document.getElementById("possession")?.value||"cass";
 const opp=possession==="opponent";
 if(type==="run"){
   dc.innerHTML=opp
    ? `<label>Opponent Run</label><input id="oppYards" type="number" value="0" min="-99" max="99"><div style="margin-top:12px"><label>Cass Defensive Players — Tackles</label><div id="tackleChips" class="player-chips"></div></div><div style="margin-top:12px"><label>Defensive Result</label><div class="def-grid"><button class="def-btn" data-def="sack">Sack</button><button class="def-btn" data-def="ff">Fumble Caused</button><button class="def-btn" data-def="fr">Fumble Recovered</button></div></div>`
    : rosterPicker("runner","Runner");
 }
 if(type==="pass"){
   dc.innerHTML=opp
    ? `<label>Opponent Pass</label><input id="oppYards" type="number" value="0" min="-99" max="99"><div style="margin-top:12px"><label>Cass Defensive Players — Tackles</label><div id="tackleChips" class="player-chips"></div></div><div style="margin-top:12px"><label>Defensive Result</label><div class="def-grid"><button class="def-btn" data-def="sack">Sack</button><button class="def-btn" data-def="int">Interception</button><button class="def-btn" data-def="pbu">Pass Breakup</button><button class="def-btn" data-def="ff">Fumble Caused</button><button class="def-btn" data-def="fr">Fumble Recovered</button></div></div>`
    : `${rosterPicker("passer","Passer")}<div style="margin-top:12px">${rosterPicker("receiver","Receiver")}</div><div style="margin-top:12px"><label>Pass Result</label><select id="passResult"><option>Complete</option><option>Incomplete</option><option>Interception</option></select></div>`;
 }
 if(type==="special"){
   dc.innerHTML=opp
    ? `<label>Opponent Special Teams</label><select id="specialType"><option>Punt</option><option>Kickoff</option><option>Field Goal</option><option>Extra Point</option><option>Punt Return</option><option>Kick Return</option><option>Blocked Kick</option></select><div style="margin-top:12px"><label>Yards</label><input id="oppYards" type="number" value="0" min="-99" max="99"></div>`
    : `${rosterPicker("specialPlayer","Player")}<div style="margin-top:12px"><label>Special Teams Play</label><select id="specialType"><option>Punt</option><option>Kickoff</option><option>Field Goal</option><option>Extra Point</option><option>Punt Return</option><option>Kick Return</option><option>Blocked Kick</option></select></div>`;
 }
 if(type==="penalty"){
   dc.innerHTML=`<div><label>Player / Team</label><div class="player-chips role-picker" data-role="penPlayer" data-multi="false"><button type="button" class="player-chip selected single-chip" data-player="-1" data-role="penPlayer"><strong>TEAM</strong><span>Team</span></button>${players.map((p,i)=>`<button type="button" class="player-chip single-chip" data-player="${i}" data-role="penPlayer"><strong>${p.n}</strong><span>${p.name}</span></button>`).join("")}</div></div><div style="margin-top:12px"><label>Penalty Yards</label><input id="penYards" type="number" value="10" min="0" max="50"></div></div><div style="margin-top:12px"><label>Penalty</label><select id="penType"><option>Holding</option><option>False Start</option><option>Offside</option><option>Pass Interference</option><option>Personal Foul</option><option>Unsportsmanlike Conduct</option><option>Delay of Game</option><option>Other</option></select>`;
 }
 if(!opp && (type==="run" || type==="pass")) renderPlayerChips();
 wireDefButtons();
 wireRosterPickers();
 updatePreview();
}
function renderPlayerChips(){
 const box=document.getElementById("tackleChips"); if(!box)return;
 box.innerHTML=players.map((p,i)=>`<button type="button" class="player-chip" data-player="${i}"><strong>${p.n}</strong><span>${p.name}</span></button>`).join("");
 box.querySelectorAll(".player-chip").forEach(b=>b.onclick=()=>b.classList.toggle("selected"));
}
function wireDefButtons(){
 document.querySelectorAll(".def-btn").forEach(b=>b.onclick=()=>b.classList.toggle("selected"));
}
function getSelectedPlayers(){
 return [...document.querySelectorAll(".player-chip.selected")].map(b=>players[Number(b.dataset.player)]);
}
function getDefStats(){
 return [...document.querySelectorAll(".def-btn.selected")].map(b=>b.dataset.def);
}
function selected(id){let x=document.getElementById(id);return x?x.value:""}
function updatePreview(){
 const p=document.getElementById("preview"); if(!p)return;
 const opp=document.getElementById("possession")?.value==="opponent";
 if(type==="run"){
   if(opp){
     const y=Number(document.getElementById("oppYards")?.value||0);
     const tack=getSelectedPlayers().map(x=>x.n).join(", ")||"No tackler selected";
     p.innerHTML=`<strong>Opponent Run</strong><br>${y>=0?"+":""}${y} yards · Tackles: ${tack}`;
   } else {
     let v=chosenPlayer("runner");p.innerHTML=`<strong>Cass Run</strong><br>${v?`${v.n} ${v.name}`:"Select a runner"} · ${startY} → ${endY} · <strong>${endY-startY>=0?"+":""}${endY-startY} yards</strong>`;
   }
 }
 if(type==="pass"){
   if(opp){
     const y=Number(document.getElementById("oppYards")?.value||0);
     const tack=getSelectedPlayers().map(x=>x.n).join(", ")||"No tackler selected";
     const defs=getDefStats().join(", ")||"No defensive result";
     p.innerHTML=`<strong>Opponent Pass</strong><br>${y>=0?"+":""}${y} yards · Tackles: ${tack} · ${defs}`;
   } else {
     let q=chosenPlayer("passer"),r=chosenPlayer("receiver"),res=selected("passResult");p.innerHTML=`<strong>Cass Pass</strong><br>${q?`${q.n} ${q.name}`:"Select passer"} → ${r?`${r.n} ${r.name}`:"Select receiver"} · ${res||"Complete"} · ${endY-startY>=0?"+":""}${endY-startY} yards`;
   }
 }
 if(type==="special"){
   let sp=chosenPlayer("specialPlayer");p.innerHTML=`<strong>${opp?"Opponent":"Cass Tech"} Special Teams</strong><br>${selected("specialType")||"Select play"} · ${opp?(document.getElementById("oppYards")?.value||0)+" yards":sp?`${sp.n} ${sp.name}`:"Select player"}`;
 }
 if(type==="penalty"){let pp=chosenPlayer("penPlayer");p.innerHTML=`<strong>${opp?"Opponent":"Cass Tech"} Penalty</strong><br>${selected("penType")||"Select penalty"} · ${pp?`${pp.n} ${pp.name}`:"Team"} · ${document.getElementById("penYards")?.value||0} yards`; }
}
function logPlay(){
 let game=document.getElementById("gameSelect").value,q=document.getElementById("quarter").value;
 const possession=document.getElementById("possession").value;
 if(!game)return alert("Select a game.");
 let p={id:"p"+Date.now(),game,q,type,side:possession,start:startY,end:endY,yards:endY-startY,defense:[],tacklers:[]};
 if(possession==="opponent"){
   if(type==="run"||type==="pass"||type==="special"){
     p.yards=Number(document.getElementById("oppYards")?.value||0);
     if(type==="special")p.special=selected("specialType");
     p.tacklers=getSelectedPlayers().map(x=>`${x.n}|${x.name}`);
     p.defense=getDefStats();
   }
   if(type==="penalty"){
     p.penalty=selected("penType");p.penPlayer=selected("penPlayer");p.penYards=Number(document.getElementById("penYards").value)||0;p.yards=0;
   }
 } else {
   if(type==="run"){let x=chosenPlayer("runner");p.runner=x?`${x.n}|${x.name}`:"";if(!p.runner)return alert("Select a runner.");}
   if(type==="pass"){let q=chosenPlayer("passer"),r=chosenPlayer("receiver");p.passer=q?`${q.n}|${q.name}`:"";p.receiver=r?`${r.n}|${r.name}`:"";p.result=selected("passResult");if(!p.passer||!p.receiver)return alert("Select passer and receiver.");if(p.result!=="Complete")p.yards=0;}
   if(type==="special"){p.special=selected("specialType");let x=chosenPlayer("specialPlayer");p.player=x?`${x.n}|${x.name}`:"";}
   if(type==="penalty"){p.penalty=selected("penType");let x=chosenPlayer("penPlayer");p.player=x?`${x.n}|${x.name}`:"TEAM|Team";p.penYards=Number(document.getElementById("penYards").value)||0;p.yards=0;}
 }
 plays.unshift(p);save();renderPlayLog();renderStats();alert("Play logged.");
}
function renderPlayLog(){
 let gid=document.getElementById("gameSelect")?.value;let arr=plays.filter(p=>p.game===gid);
 document.getElementById("playCount").textContent=`${arr.length} play${arr.length===1?"":"s"}`;
 document.getElementById("playLog").innerHTML=arr.length?`<table><thead><tr><th>Q</th><th>Side</th><th>Type</th><th>Player / Defense</th><th>Yards</th><th></th></tr></thead><tbody>${arr.map(p=>{
 let player=p.side==="opponent" ? "Opponent" : p.type==="run"?p.runner:p.type==="pass"?`${p.passer} → ${p.receiver}`:p.type==="penalty"?p.player:p.player;
 let defense=p.tacklers?.length?`T: ${p.tacklers.map(x=>x.split("|")[0]).join(", ")}`:"";
 if(p.defense?.length) defense += `${defense?" · ":""}${p.defense.map(x=>({sack:"Sack",int:"INT",pbu:"PBU",ff:"FF",fr:"FR"}[x]||x)).join(", ")}`;
 let result=p.type==="penalty"?`${p.penalty} (${p.penYards} yds)`:p.type==="special"?`${p.special} · ${p.yards} yds`:p.side==="opponent"?`${p.yards>=0?"+":""}${p.yards} yds`:p.type==="pass"?`${p.result} · ${p.yards} yds`:`${p.yards>=0?"+":""}${p.yards} yds`;
 return `<tr><td>${p.q}</td><td><span class="badge">${p.side==="opponent"?"Opponent":"Cass"}</span></td><td><span class="badge">${p.type}</span></td><td>${player||"—"}${defense?`<div class="muted" style="font-size:11px;margin-top:4px">${defense}</div>`:""}</td><td>${result}</td><td><button class="btn danger" onclick="deletePlay('${p.id}')">Delete</button></td></tr>`}).join("")}</tbody></table>`:'<div class="empty">No plays logged for this game.</div>';
}
function deletePlay(id){if(confirm("Delete this play?")){plays=plays.filter(p=>p.id!==id);save();renderAll()}}
function stats(){
 let out={}; players.forEach((x,i)=>out[i]={num:x.n,name:x.name,cmp:0,att:0,passY:0,car:0,rushY:0,rec:0,recY:0,tack:0,sack:0,int:0,pbu:0,ff:0,fr:0});
 plays.forEach(p=>{
  if(p.side==="cass"){
   if(p.type==="run"){let idx=players.findIndex(x=>`${x.n}|${x.name}`===p.runner);if(idx>=0){out[idx].car++;out[idx].rushY+=p.yards}}
   if(p.type==="pass"){
    let qi=players.findIndex(x=>`${x.n}|${x.name}`===p.passer),ri=players.findIndex(x=>`${x.n}|${x.name}`===p.receiver);
    if(qi>=0){out[qi].att++;if(p.result==="Complete"){out[qi].cmp++;out[qi].passY+=p.yards}}
    if(ri>=0&&p.result==="Complete"){out[ri].rec++;out[ri].recY+=p.yards}
   }
  }
  if(p.side==="opponent"){
   (p.tacklers||[]).forEach(t=>{let idx=players.findIndex(x=>`${x.n}|${x.name}`===t);if(idx>=0)out[idx].tack++});
   (p.defense||[]).forEach(d=>{
    (p.tacklers||[]).forEach(t=>{});
    if(d==="sack"){let t=p.tacklers?.[0];if(t){let idx=players.findIndex(x=>`${x.n}|${x.name}`===t);if(idx>=0)out[idx].sack++}}
    if(d==="int"){let t=p.tacklers?.[0];if(t){let idx=players.findIndex(x=>`${x.n}|${x.name}`===t);if(idx>=0)out[idx].int++}}
    if(d==="pbu"){let t=p.tacklers?.[0];if(t){let idx=players.findIndex(x=>`${x.n}|${x.name}`===t);if(idx>=0)out[idx].pbu++}}
    if(d==="ff"){let t=p.tacklers?.[0];if(t){let idx=players.findIndex(x=>`${x.n}|${x.name}`===t);if(idx>=0)out[idx].ff++}}
    if(d==="fr"){let t=p.tacklers?.[0];if(t){let idx=players.findIndex(x=>`${x.n}|${x.name}`===t);if(idx>=0)out[idx].fr++}}
   });
  }
 });return Object.values(out).filter(x=>x.car||x.att||x.rec||x.tack||x.sack||x.int||x.pbu||x.ff||x.fr)
}
function renderStats(){
 let s=stats();
 const off=s.filter(x=>x.car||x.att||x.rec);
 const def=s.filter(x=>x.tack||x.sack||x.int||x.pbu||x.ff||x.fr);
 document.getElementById("individualStats").innerHTML=`
 <h3 style="margin-top:0">Offense</h3>
 ${off.length?`<table><thead><tr><th>Player</th><th>Cmp/Att</th><th>Pass Yds</th><th>Car</th><th>Rush Yds</th><th>Rec</th><th>Rec Yds</th></tr></thead><tbody>${off.map(x=>`<tr><td><strong>${x.num}</strong> ${x.name}</td><td>${x.cmp}/${x.att}</td><td>${x.passY}</td><td>${x.car}</td><td>${x.rushY}</td><td>${x.rec}</td><td>${x.recY}</td></tr>`).join("")}</tbody></table>`:'<div class="empty">Log offensive plays to generate offensive statistics.</div>'}
 <h3 style="margin:26px 0 10px">Defense</h3>
 ${def.length?`<table><thead><tr><th>Player</th><th>Tackles</th><th>Sacks</th><th>INT</th><th>PBU</th><th>FF</th><th>FR</th></tr></thead><tbody>${def.map(x=>`<tr><td><strong>${x.num}</strong> ${x.name}</td><td>${x.tack}</td><td>${x.sack}</td><td>${x.int}</td><td>${x.pbu}</td><td>${x.ff}</td><td>${x.fr}</td></tr>`).join("")}</tbody></table>`:'<div class="empty">Log opponent plays and select Cass defensive players to generate defensive statistics.</div>'}`;
 let att=s.reduce((a,x)=>a+x.att,0),cmp=s.reduce((a,x)=>a+x.cmp,0),passY=s.reduce((a,x)=>a+x.passY,0),car=s.reduce((a,x)=>a+x.car,0),rush=s.reduce((a,x)=>a+x.rushY,0),rec=s.reduce((a,x)=>a+x.rec,0),recY=s.reduce((a,x)=>a+x.recY,0);
 const oppY=plays.filter(p=>p.side==="opponent"&&(p.type==="run"||p.type==="pass"||p.type==="special")).reduce((a,p)=>a+p.yards,0);
 const pens=plays.filter(p=>p.type==="penalty").reduce((a,p)=>a+(p.penYards||0),0);
 document.getElementById("teamStats").innerHTML=`<div class="statgrid"><div class="stat"><b>${plays.length}</b><span>Total Plays Logged</span></div><div class="stat"><b>${att}</b><span>Pass Attempts</span></div><div class="stat"><b>${passY}</b><span>Passing Yards</span></div><div class="stat"><b>${car}</b><span>Rush Attempts</span></div><div class="stat"><b>${rush}</b><span>Rushing Yards</span></div><div class="stat"><b>${cmp}</b><span>Completions</span></div><div class="stat"><b>${rec}</b><span>Receptions</span></div><div class="stat"><b>${recY}</b><span>Receiving Yards</span></div><div class="stat"><b>${oppY}</b><span>Opponent Yards Logged</span></div><div class="stat"><b>${pens}</b><span>Penalty Yards Logged</span></div></div>`;
}
function renderAll(){renderSchedule();renderGameSelect();controls();renderField();renderPlayLog();renderStats();}

document.querySelectorAll(".navbtn").forEach(b=>b.onclick=()=>{document.querySelectorAll(".navbtn").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));document.getElementById(b.dataset.page).classList.add("active");});
document.querySelectorAll(".type-btn").forEach(b=>b.onclick=()=>{document.querySelectorAll(".type-btn").forEach(x=>x.classList.remove("active"));b.classList.add("active");type=b.dataset.type;controls();renderField();});
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.getElementById("individualStats").style.display=b.dataset.stab==="individual"?"block":"none";document.getElementById("teamStats").style.display=b.dataset.stab==="team"?"block":"none";});
document.getElementById("gameSelect").onchange=renderPlayLog;
document.getElementById("possession").onchange=()=>{controls();renderField();};
document.addEventListener("change",updatePreview);document.addEventListener("input",updatePreview);
renderAll();
</script>
</body>
